name: CI
on: 
    push:
      branches:
        - 0.22.x
    pull_request:
    schedule:
        - cron: '0 4 * * 6' # Every Saturday on 4am
    workflow_dispatch:

# A new push to a pull request cancels its running jobs; other runs get a unique group.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    psalm:
        name: Static analysis
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none
              env:
                  fail-fast: true

            - name: Get Composer Cache Directories
              id: composer-cache
              run: |
                  echo "files_cache=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                  echo "vcs_cache=$(composer config cache-vcs-dir)" >> $GITHUB_OUTPUT

            - name: Retrieve cached packages
              uses: actions/cache@v6
              with:
                  path: |
                    ${{ steps.composer-cache.outputs.files_cache }}
                    ${{ steps.composer-cache.outputs.vcs_cache }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                    ${{ runner.os }}-composer-

            - name: Install composer dependencies
              run: composer update --prefer-dist
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Run Psalm
              run: vendor/bin/psalm --output-format=github --shepherd

    phpcs:
        name: Code style
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  tools: composer:v2, cs2pr
                  coverage: none
              env:
                  fail-fast: true

            - name: Get Composer Cache Directories
              id: composer-cache
              run: |
                  echo "files_cache=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                  echo "vcs_cache=$(composer config cache-vcs-dir)" >> $GITHUB_OUTPUT

            - name: Retrieve cached packages
              uses: actions/cache@v6
              with:
                  path: |
                    ${{ steps.composer-cache.outputs.files_cache }}
                    ${{ steps.composer-cache.outputs.vcs_cache }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                    ${{ runner.os }}-composer-

            - name: Install composer dependencies
              run: composer update --prefer-dist
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Run PHPCodeSniffer
              run: vendor/bin/phpcs --report=checkstyle -q --parallel=1 | cs2pr

    test-static-analysis:
        name: Run static analysis on the tests themselves
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.2
                  tools: composer:v2
                  coverage: none
                  extensions: intl, mbstring, bcmath, sodium
              env:
                  fail-fast: true

            - name: Install composer dependencies (high deps)
              run: cd tools/behat && composer install

            - name: Static analysis
              run: cd tools/behat && vendor/bin/psalm

    tests:
        name: Test on ${{matrix.php}} - Psalm ${{matrix.psalm}} - ${{matrix.deps}} deps
        runs-on: ubuntu-latest
        continue-on-error: ${{matrix.php == '8.0'}}
        strategy:
            matrix:
                # Pull requests test the lowest and highest PHP; pushes, the schedule and manual runs test all.
                php: ${{ fromJSON(github.event_name == 'pull_request' && '["8.1", "8.4"]' || '["8.1", "8.2", "8.3", "8.4"]') }}
                deps: ['high', 'low', 'stable']
                # Psalm 7.2, the first Psalm 7 that accepts this plugin's 0.22.x, needs PHP 8.2.
                psalm: ['6', '7']
                exclude:
                  - php: 8.1
                    psalm: '7'
                  - php: 8.4
                    deps: low
            fail-fast: false
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{matrix.php}}
                  tools: composer:v2
                  coverage: none
              env:
                  fail-fast: true

            - name: Get Composer Cache Directories
              id: composer-cache
              run: |
                  echo "files_cache=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                  echo "vcs_cache=$(composer config cache-vcs-dir)" >> $GITHUB_OUTPUT

            - name: Retrieve cached packages
              uses: actions/cache@v6
              with:
                  path: |
                    ${{ steps.composer-cache.outputs.files_cache }}
                    ${{ steps.composer-cache.outputs.vcs_cache }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                    ${{ runner.os }}-composer-

            - name: Install composer dependencies (high deps)
              run: composer update --prefer-dist --no-interaction --with vimeo/psalm:^${{matrix.psalm}}
              if: ${{matrix.deps == 'high'}}
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Install composer tool dependencies (high deps)
              run: cd tools/behat && composer update --prefer-dist --no-interaction
              if: ${{matrix.deps == 'high'}}
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Install composer dependencies (low deps)
              run: composer update --prefer-dist --no-interaction --prefer-stable --prefer-lowest --with vimeo/psalm:^${{matrix.psalm}}
              if: ${{matrix.deps == 'low'}}
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Install composer tool dependencies (low deps)
              run: cd tools/behat && composer update --prefer-dist --no-interaction --prefer-stable --prefer-lowest
              if: ${{matrix.deps == 'low'}}
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Install composer dependencies (stable deps)
              run: composer update --prefer-dist --no-interaction --prefer-stable --with vimeo/psalm:^${{matrix.psalm}}
              if: ${{matrix.deps == 'stable'}}
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Install composer tool dependencies (stable deps)
              run: cd tools/behat && composer update --prefer-dist --no-interaction --prefer-stable
              if: ${{matrix.deps == 'stable'}}
              env:
                  COMPOSER_ROOT_VERSION: 0.22.x-dev

            - name: Show Psalm version
              run: vendor/bin/psalm --version

            - name: Show PHPUnit version
              run: vendor/bin/phpunit --version

            - name: Run tests
              run: tools/behat/behat-parallel.sh
              env:
                  BEHAT_SKIP_TAGS: ${{ matrix.psalm == '6' && '@psalm7' || '' }}
